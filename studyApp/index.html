<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyApp </title>
  
  <!-- 1. Le CSS global commun à toute l'équipe -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 2. Votre propre fichier CSS pour les cartes -->
  <link rel="stylesheet" href="css/cards.css">
  <!-- 3. Votre propre fichier CSS pour navigation -->
  <link rel="stylesheet" href="css/navigation.css">


</head>
<body>

 <div class="container">
    <!-- Barre de recherche -->
    <div class="search-container">
      <input type="text" id="search-input" class="search" placeholder="Rechercher un module...">
      <span>🔍</span>
    </div>

    <!-- Menus de sélection (Filtres) -->
    <div class="searchs">
      <p>Speciality    ---->    Semester</p>

      <div class="filter-bar">
        <!-- Spécialité -->
        <div class="filter-group">
          <label for="select-specialty">Speciality</label>
          <select id="select-specialty" class="filter-select">
            <option value="">-- Select the Speciality --</option>
            <option value="tc">Tronc Commun (S1 - S4)</option>
            <option value="res">Réseaux & Télécoms (S5 - S6)</option>
          </select>
        </div>

        <!-- Semestre -->
        <div class="filter-group">
          <label for="select-semester">Semester</label>
          <select id="select-semester" class="filter-select" disabled>
            <option value="">-- Select the Semestre --</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Écran d'accueil (Empty State) -->
    <div id="empty-state" class="empty-state">
      <div class="pointer-arrow">▲</div>
      <div class="empty-state-icon">📚</div>
      <h2>Bienvenue sur ton Espace d'Études !</h2>
      <p> Select your  <strong>Speciality</strong> and your <strong>Semester</strong> ci-dessus pour afficher tes modules.</p>
    </div>

    <!-- Conteneur de la Grille de Cartes -->
    <div id="modules-grid" class="modules-grid hidden"></div>
  </div>

  <script src="js/cards.js"></script>

</body>
</html>
