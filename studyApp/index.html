<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyApp </title>
  
  <!-- 1. Le CSS global commun à toute l'équipe -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 2. Votre propre fichier CSS pour les cartes -->
  <link rel="stylesheet" href="css/cards.css">
</head>
<body>

  <div class="filter-bar">
       <!-- Specialty Filter -->
      <div class="filter-group">
         <label for="select-specialty">Specialty</label>
       <select id="select-specialty" class="filter-select">
         <option value="">-- Choose Specialty --</option>
         <option value="tc">Tronc Commun (S1 - S4)</option>
         <option value="res">Networks & Telecoms (S5 - S10)</option>
       </select>
      </div>

        <!-- Semester Filter (laissé vide par défaut, JavaScript va le remplir) -->
      <div class="filter-group">
        <label for="select-semester">Semester</label>
        <select id="select-semester" class="filter-select" disabled>
         <option value="">-- Choose Semester --</option>
        </select>
      </div>

  </div> 

  <!-- FIX 1: Added id="empty-state" so cards.js can hide it -->
  <div id="empty-state" class="empty-state">
      <div class="pointer-arrow">▲</div>
      <div class="empty-state-icon">📚</div>
      <h2>Welcome to your Study Area !</h2>
      <p>Select your <strong>Specialization</strong> and 
        <strong>Semester</strong> above to view your modules.
      </p>
  </div>

  <!-- FIX 2: Added missing container where cards.js injects cards -->
  <div id="modules-grid" class="modules-grid hidden"></div>

  <script src="js/cards.js"></script>

</body>
</html>
